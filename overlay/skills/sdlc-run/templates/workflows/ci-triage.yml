# When CI fails on a PR, Claude reads the failed job logs and posts a three-line triage
# to the PR thread: most likely cause, flaky or real, what to do. Read-only judgment --
# the playbook's step 1 for CI/CD -- so it needs no write access to code.
#
# workflow_run executes THIS file from master, never the PR's copy. Ships dark without
# ANTHROPIC_API_KEY.
name: CI triage

on:
  workflow_run:
    workflows: [{{CI_WORKFLOW}}]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read
  id-token: write

jobs:
  triage:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-24.04
    steps:
      - name: Is the key seeded?
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not set; CI triage skipped (docs/sdlc.md, Secrets)"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Collect the failed job logs
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run view "$RUN_ID" --log-failed 2>/dev/null | tail -300 > /tmp/failed.log || true

      - name: Triage
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1.0.216
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
            CI RUN: ${{ github.event.workflow_run.html_url }}

            Read /tmp/failed.log (the failed CI job output). Identify the most likely
            cause, say whether the failure looks flaky or real, and post a THREE-LINE
            summary to the PR thread with `gh pr comment`, prefixed "CI triage:". Do not
            edit any file.
          claude_args: |
            --allowedTools "Read,Grep,Bash(gh pr comment:*),Bash(gh pr view:*)"
            --max-turns 6
