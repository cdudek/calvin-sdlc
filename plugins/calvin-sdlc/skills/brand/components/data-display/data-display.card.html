<!-- @dsCard group="Components" viewport="720x560" name="Cards, badges, tags & rating" subtitle="Data-display family: Card · Badge (info, not interactive) · Tag (interactive) · RatingStars" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--background-color-surface); }
  .lbl { display: block; margin: 0 0 8px; color: var(--text-color-subtlest); }
  .grid { display: grid; grid-template-columns: 260px 1fr; gap: 24px; align-items: start; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .banner { display:flex; gap:24px; flex-wrap:wrap; padding:12px 16px; margin-bottom:20px; border:1px solid var(--border-color-subtle); border-radius:var(--radius-xl); background:var(--background-color-surface-elevation-1); }
  .banner .b { max-width:44ch; }
  .banner .k { display:block; margin-bottom:2px; color:var(--text-color-main); }
  .banner .v { color:var(--text-color-subtle); }
  .sub { color:var(--text-color-subtlest); font-weight:400; text-transform:none; margin-left:6px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Card, Badge, Tag, RatingStars, Button, Icon } = window.OMRDesignSystem_d9b3c2;

function Demo() {
  const [tags, setTags] = React.useState(['CRM software', 'Free trial', 'Rating 4+']);
  const [active, setActive] = React.useState('Popular');
  const filters = ['Popular', 'Newest', 'Top rated'];

  return (
    <div>
      <div className="banner">
        <div className="b">
          <span className="k txt-label-s-bold-uppercase">Badge — Informationsträger</span>
          <span className="v txt-body-s-regular">Trägt Zustand/Info (z.&nbsp;B. einen Status). <b>Nicht klickbar.</b></span>
        </div>
        <div className="b">
          <span className="k txt-label-s-bold-uppercase">Tag — interaktiv</span>
          <span className="v txt-body-s-regular">Nutzeraktion: filtern, auswählen, entfernen. <b>Klickbar.</b></span>
        </div>
      </div>

      <div className="grid">
        <Card
          media={<div style={{height:96, background:'linear-gradient(120deg,#7337fc,#8259ff)'}}/>}
          footer={<><Button size="s" intent="color">View</Button><Button size="s" variant="outline" intent="neutral">Compare</Button></>}
        >
          <h3 className="txt-headline-l-bold text-main" style={{margin:0}}>HubSpot CRM</h3>
          <RatingStars value={4.5} showValue reviewCount={1234}/>
          <p className="txt-body-s-regular text-subtle" style={{margin:0}}>All-in-one marketing, sales & service platform.</p>
        </Card>

        <div>
          <span className="txt-label-s-bold-uppercase lbl">Badge — Status / Info<span className="sub">not interactive · filled</span></span>
          <div className="row">
            <Badge tone="success" prefixIcon={<Icon name="check" size={13}/>}>Verified</Badge>
            <Badge tone="primary">Featured</Badge>
            <Badge tone="secondary">Trending</Badge>
            <Badge tone="warning">Beta</Badge>
            <Badge tone="error">Deprecated</Badge>
            <Badge tone="neutral">Draft</Badge>
          </div>

          <span className="txt-label-s-bold-uppercase lbl">Badge — outlined</span>
          <div className="row">
            <Badge tone="neutral" outlined>Category</Badge>
            <Badge tone="primary" outlined>Analytics</Badge>
            <Badge tone="success" outlined>Live</Badge>
          </div>

          <span className="txt-label-s-bold-uppercase lbl">Badge — count &amp; dot<span className="sub">notification</span></span>
          <div className="row">
            <Badge count={3}/>
            <Badge count={128} max={99}/>
            <Badge count={5} tone="error"/>
            <Badge count={9} tone="neutral"/>
            <span style={{display:'inline-flex',alignItems:'center',gap:6}} className="txt-body-s-regular text-subtle"><Badge dot tone="success"/> Online</span>
          </div>

          <span className="txt-label-s-bold-uppercase lbl">Tag — filter<span className="sub">klickbar · auswählbar</span></span>
          <div className="row">
            {filters.map(f => (
              <Tag key={f} selected={active === f} onClick={() => setActive(f)}>{f}</Tag>
            ))}
          </div>

          <span className="txt-label-s-bold-uppercase lbl">Tag — removable<span className="sub">Auswahl entfernen</span></span>
          <div className="row">
            {tags.map((t) => <Tag key={t} onRemove={() => setTags(ts => ts.filter(x => x !== t))}>{t}</Tag>)}
            {tags.length === 0 && <span className="txt-body-s-regular text-subtlest">Alle Tags entfernt — neu laden zum Zurücksetzen.</span>}
          </div>

          <span className="txt-label-s-bold-uppercase lbl">Rating scale</span>
          <div className="row">
            <RatingStars value={3.5} size={20}/>
            <RatingStars value={5} dense/>
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
