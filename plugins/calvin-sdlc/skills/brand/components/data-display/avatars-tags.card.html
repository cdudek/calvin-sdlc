<!-- @dsCard group="Components" viewport="700x260" name="Avatars & tags" subtitle="User/company avatars with status · removable tags" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--background-color-surface); }
  .lbl { display: block; margin: 0 0 12px; color: var(--text-color-subtlest); }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Avatar, Tag } = window.OMRDesignSystem_d9b3c2;
function Demo() {
  const [tags, setTags] = React.useState(['CRM software', 'Free trial', 'Rating 4+']);
  return (
    <div>
      <span className="txt-label-s-bold-uppercase lbl">Avatars — sizes, status, square</span>
      <div className="row">
        <Avatar name="Ada L" size="xs" />
        <Avatar name="Ben O" size="s" status="online" />
        <Avatar name="Cara D" size="m" status="busy" />
        <Avatar name="Deniz K" size="l" status="away" />
        <Avatar name="Ella R" size="xl" />
        <Avatar name="Acme GmbH" square size="l" />
      </div>
      <span className="txt-label-s-bold-uppercase lbl">Tags — removable + selected</span>
      <div className="row">
        {tags.map((t) => <Tag key={t} onRemove={() => setTags(ts => ts.filter(x => x !== t))}>{t}</Tag>)}
        <Tag selected>Selected</Tag>
        {tags.length === 0 && <span className="txt-body-s-regular text-subtlest">All tags removed — reload to reset.</span>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
