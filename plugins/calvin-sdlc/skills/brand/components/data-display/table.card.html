<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style> body { margin: 0; padding: 24px; background: var(--background-color-surface); } </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Table, Avatar, Chip, RatingStars } = window.OMRDesignSystem_d9b3c2;
function Demo() {
  const columns = [
    { key: 'product', label: 'Product' },
    { key: 'category', label: 'Category' },
    { key: 'rating', label: 'Rating' },
    { key: 'status', label: 'Status', align: 'right' },
  ];
  const rows = [
    { product: <span style={{display:'flex',alignItems:'center',gap:10}}><Avatar name="Flowdesk CRM" square size="s"/> Flowdesk CRM</span>, category: 'CRM software', rating: <RatingStars value={4.6} size={14} showValue/>, status: <Chip tone="success">Verified</Chip> },
    { product: <span style={{display:'flex',alignItems:'center',gap:10}}><Avatar name="Mailpilot" square size="s"/> Mailpilot</span>, category: 'Email marketing', rating: <RatingStars value={4.4} size={14} showValue/>, status: <Chip tone="neutral" outlined>Claimed</Chip> },
    { product: <span style={{display:'flex',alignItems:'center',gap:10}}><Avatar name="Taskly" square size="s"/> Taskly</span>, category: 'Project mgmt', rating: <RatingStars value={4.8} size={14} showValue/>, status: <Chip tone="success">Verified</Chip> },
  ];
  return <Table columns={columns} rows={rows} onRowClick={()=>{}} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
