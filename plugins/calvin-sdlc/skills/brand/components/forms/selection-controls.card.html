<!-- @dsCard group="Components" viewport="700x340" name="Selection controls" subtitle="Checkbox · radio · radio card · toggle switch" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--background-color-surface); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
  .lbl { display: block; margin: 0 0 12px; color: var(--text-color-subtlest); }
  .col { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Checkbox, Radio, RadioCard, ToggleSwitch } = window.OMRDesignSystem_d9b3c2;
function Demo() {
  const [checks, setChecks] = React.useState({ a: true, b: false });
  const [plan, setPlan] = React.useState('y');
  const [toggles, setToggles] = React.useState({ n: true, m: false });
  return (
    <div className="grid">
      <div>
        <span className="txt-label-s-bold-uppercase lbl">Checkbox</span>
        <div className="col">
          <Checkbox checked={checks.a} onChange={(v)=>setChecks(s=>({...s,a:v}))} label="Email me product updates" />
          <Checkbox checked={checks.b} onChange={(v)=>setChecks(s=>({...s,b:v}))} label="Free trial" description="14 days, no credit card" />
          <Checkbox indeterminate label="Select all categories" />
          <Checkbox error label="Accept terms (required)" />
          <Checkbox disabled checked label="Disabled" />
        </div>
        <span className="txt-label-s-bold-uppercase lbl" style={{marginTop:20}}>Toggle switch</span>
        <div className="col">
          <ToggleSwitch checked={toggles.n} onChange={(v)=>setToggles(s=>({...s,n:v}))} label="Email notifications" />
          <ToggleSwitch checked={toggles.m} onChange={(v)=>setToggles(s=>({...s,m:v}))} size="s" label="Compact size" />
          <ToggleSwitch checked color="success" label="Success colour" onChange={()=>{}} />
        </div>
      </div>
      <div>
        <span className="txt-label-s-bold-uppercase lbl">Radio</span>
        <div className="col" style={{marginBottom:20}}>
          <Radio name="r" checked label="Standard shipping" />
          <Radio name="r" label="Express shipping" description="Next business day" />
        </div>
        <span className="txt-label-s-bold-uppercase lbl">Radio card</span>
        <div className="col">
          <RadioCard name="plan" value="m" checked={plan==='m'} onChange={()=>setPlan('m')} title="Monthly" description="29 € / month, cancel anytime" />
          <RadioCard name="plan" value="y" checked={plan==='y'} onChange={()=>setPlan('y')} title="Yearly" description="Save 20% — 279 € / year" />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
