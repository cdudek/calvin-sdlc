<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--background-color-surface); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Select, Textarea, RangeSlider } = window.OMRDesignSystem_d9b3c2;
function Demo() {
  const [cat, setCat] = React.useState('CRM software');
  const [price, setPrice] = React.useState(120);
  return (
    <div className="grid">
      <div style={{display:'flex',flexDirection:'column',gap:20}}>
        <Select label="Category" value={cat} onChange={setCat}
          options={['CRM software','Email marketing','Project management','Analytics','SEO tools']} />
        <RangeSlider label="Max price (€ / month)" value={price} min={0} max={500} step={10} onChange={setPrice} />
      </div>
      <Textarea label="Your review" rows={6} placeholder="What did you like best about this product?" helper="Minimum 40 characters" />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
