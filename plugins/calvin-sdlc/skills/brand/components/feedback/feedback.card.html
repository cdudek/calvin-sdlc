<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--background-color-surface); }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .lbl { display: block; margin: 18px 0 12px; color: var(--text-color-subtlest); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Alert, Toast, Tooltip, Button, BtnLink, Icon } = window.OMRDesignSystem_d9b3c2;
function Demo() {
  return (
    <div>
      <span className="txt-label-s-bold-uppercase lbl" style={{marginTop:0}}>Message banner — types</span>
      <div className="col">
        <Alert type="info" headline="Heads up">A new version of the dashboard is available.</Alert>
        <Alert type="success" headline="Changes saved successfully">Your profile is now up to date.</Alert>
        <Alert type="error" headline="Payment failed" action={<BtnLink href="#" variant="color">Update →</BtnLink>}>We couldn't process your subscription.</Alert>
        <Alert type="warning" headline="Trial ends in 3 days">Upgrade to keep your data and integrations.</Alert>
        <Alert type="reminder" message="Your meeting starts in 15 minutes." />
        <Alert type="neutral" message="This profile hasn't been claimed by the vendor yet." />
      </div>
      <span className="txt-label-s-bold-uppercase lbl">Condensed · unfilled · inline (flush edge)</span>
      <div className="col">
        <Alert type="success" message="Saved." condensed />
        <Alert type="warning" headline="Almost there" filled={false}>Two required fields are still empty.</Alert>
        <Alert type="info" inline="top" message="Sticky banner — flush to the top edge of its container." />
      </div>
      <span className="txt-label-s-bold-uppercase lbl">Toast &amp; tooltip</span>
      <div style={{display:'flex',gap:24,alignItems:'center',flexWrap:'wrap'}}>
        <Toast tone="success" message="Review published — thanks for sharing!" onClose={()=>{}} />
        <Tooltip label="Add to comparison"><Button variant="outline" intent="neutral" size="s" prefixIcon={<Icon name="plus" size={16}/>}>Hover me</Button></Tooltip>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
