<!-- @dsCard group="Components" viewport="860x980" name="Decoration elements" subtitle="One kind per slide · up to 3 instances · zweifarbig aus den neun Brand-Kit-Farben · never mixed with patterns" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--background-color-surface); color: var(--text-color-main); font-family: var(--font-sans); }
  .lbl { display: block; margin: 0 0 14px; color: var(--text-color-subtlest); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 28px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 6px; border-radius: var(--radius-lg); border: 1px solid var(--border-color-subtle); min-height: 96px; justify-content: center; }
  .cell .cap { font-family: var(--font-mono); font-size: 10px; color: var(--text-color-subtle); }
  .demo { position: relative; height: 200px; border-radius: var(--radius-2xl); overflow: hidden; background: var(--background-color-surface-elevation-1); border: 1px solid var(--border-color-subtle); display: flex; align-items: center; justify-content: center; }
  .demo h3 { margin: 0; font-weight: 800; font-size: 24px; color: var(--text-color-main); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 28px; }
  .box { position: relative; height: 180px; border-radius: var(--radius-xl); overflow: hidden; background: var(--background-color-surface-elevation-1); border: 1px solid var(--border-color-subtle); display: flex; align-items: flex-end; justify-content: flex-start; padding: 0 0 16px 16px; box-sizing: border-box; }
  .box h4 { margin: 0; font-weight: 800; font-size: 16px; position: relative; max-width: 56%; line-height: 1.2; }
  .tag { position: absolute; right: 12px; top: 10px; font-size: 11px; font-family: var(--font-mono); padding: 3px 8px; border-radius: 999px; z-index: 3; }
  .ok { background: var(--background-color-success-subtle); color: var(--text-color-success); }
  .no { background: var(--background-color-error-subtle); color: var(--text-color-error); }
  .cap { font-size: 11px; font-family: var(--font-mono); color: var(--text-color-subtle); margin-top: 6px; }
  .rules { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .rule { padding: 14px 16px; border-radius: var(--radius-xl); border: 1px solid var(--border-color-subtle); background: var(--background-color-surface-elevation-1); font-size: 13px; color: var(--text-color-subtle); }
  .rule b { color: var(--text-color-main); display: block; margin-bottom: 5px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Decoration, BackgroundPattern } = window.OMRDesignSystem_d9b3c2;
const NAMES = ["01","03","04","05","06","07","08","09","10","11","12","13","14","15","16","17"];
// base shape / accent shape — every combination of the nine brand-kit colours is permitted
const COMBOS = [
  ["#8259ff","#f2b200","purple strong + yellow strong"],
  ["#00adad","#8259ff","mint strong + purple strong"],
  ["#8259ff","#ada6fc","purple strong + purple soft"],
  ["#f2b200","#80e0db","yellow strong + mint soft"],
];

function Demo() {
  return (
    <div>
      <span className="txt-label-s-bold-uppercase lbl">All 16 decorations (direction: left)</span>
      <div className="grid">
        {NAMES.map((n) => (
          <div className="cell" key={n}>
            <Decoration name={n} direction="left" size={56} />
            <span className="cap">{n}</span>
          </div>
        ))}
      </div>

      <span className="txt-label-s-bold-uppercase lbl">Farbkombinationen — zwei der neun Brand-Kit-Farben, frei kombinierbar</span>
      <div className="grid" style={{gridTemplateColumns:'repeat(4, 1fr)'}}>
        {COMBOS.map(([a,b,label]) => (
          <div className="cell" key={label}>
            <Decoration name="08" direction="left" size={64} colors={[a,b]} />
            <span className="cap">{label}</span>
          </div>
        ))}
      </div>

      <span className="txt-label-s-bold-uppercase lbl">One kind per slide — up to 3 instances of it</span>
      <div className="row">
        <div>
          <div className="box">
            <span className="tag ok">✓ correct</span>
            <Decoration name="08" direction="left" size={92} style={{position:'absolute', top:-26, left:-30, transform:'rotate(-12deg)'}} />
            <h4>Title slide</h4>
          </div>
          <div className="cap">one instance · im Anschnitt</div>
        </div>
        <div>
          <div className="box">
            <span className="tag ok">✓ correct</span>
            <Decoration name="08" direction="left" size={86} style={{position:'absolute', top:-30, left:-34, transform:'rotate(-12deg)'}} />
            <Decoration name="08" direction="right" size={78} style={{position:'absolute', bottom:-28, right:-30, transform:'rotate(24deg)'}} />
            <Decoration name="08" direction="left" size={62} style={{position:'absolute', bottom:-26, left:'62%', transform:'rotate(140deg)'}} />
            <h4>Chapter slide</h4>
          </div>
          <div className="cap">same element · three instances (max)</div>
        </div>
        <div>
          <div className="box">
            <span className="tag no">✕ never</span>
            <Decoration name="08" direction="left" size={86} style={{position:'absolute', top:-30, left:-34, transform:'rotate(-12deg)'}} />
            <Decoration name="14" direction="right" size={78} style={{position:'absolute', bottom:-26, right:-28, transform:'rotate(18deg)'}} />
            <h4>Title slide</h4>
          </div>
          <div className="cap">two different decoration elements</div>
        </div>
      </div>

      <span className="txt-label-s-bold-uppercase lbl">Decoration or pattern — never both</span>
      <div className="row">
        <div>
          <div className="box">
            <span className="tag ok">✓ default</span>
            <Decoration name="17" direction="left" size={90} colors={['#8259ff','#f2b200']} style={{position:'absolute', top:-28, left:-32, transform:'rotate(-14deg)'}} />
            <Decoration name="17" direction="right" size={78} colors={['#8259ff','#f2b200']} style={{position:'absolute', bottom:-26, right:-28, transform:'rotate(22deg)'}} />
            <h4>Designed with decorations</h4>
          </div>
          <div className="cap">decoration elements — the OMR standard</div>
        </div>
        <div>
          <div className="box" style={{background:'#8259ff', border:'none'}}>
            <span className="tag ok">✓ alternative</span>
            <BackgroundPattern pattern="bubbles" variant="filled" background="purple-strong" scale={1.7} />
            <h4 style={{color:'#fff'}}>Subtle pattern only</h4>
          </div>
          <div className="cap">background pattern — no decorations</div>
        </div>
        <div>
          <div className="box" style={{background:'#8259ff', border:'none'}}>
            <span className="tag no">✕ never</span>
            <BackgroundPattern pattern="bubbles" variant="filled" background="purple-strong" scale={1.7} />
            <Decoration name="17" direction="left" size={86} colors={['#f2b200','#80e0db']} style={{position:'absolute', top:-28, left:-32, transform:'rotate(-14deg)'}} />
            <h4 style={{color:'#fff'}}>Both at once</h4>
          </div>
          <div className="cap">pattern + decoration mixed</div>
        </div>
      </div>

      <span className="txt-label-s-bold-uppercase lbl">The rules</span>
      <div className="rules">
        <div className="rule"><b>The OMR default</b>Decoration elements are the standard way to design an OMR document — title and chapter slides get their character here.</div>
        <div className="rule"><b>One kind, up to 3 times</b>Never combine different decoration elements on a slide. One element, used once, twice or three times; on title slides and chapter dividers in the bleed and at different angles, from the set 07, 08, 09, 11, 13, 14, 16, 17.</div>
        <div className="rule"><b>Never with a pattern</b>Either a subtle background pattern or decoration elements. Never both in one design. On title slides and chapter dividers patterns are excluded (CLAUDE.md §6, §10). Text over a pattern is the intended use; the text colour is checked against background and pattern colour.</div>
        <div className="rule"><b>Always two-coloured, nine colours</b>Both colours free from Purple / Mint / Yellow in strong, medium, soft. Every combination is allowed, within a family as well as across families. No black, no white. No decoration colour may equal the background colour, and the two colours are never identical. <code>colors={'{'}[base shape, accent shape]{'}'}</code>: the shape drawn first carries colour 1.</div>
        <div className="rule"><b>The colour tweak chooses the combination</b>Not a single uniform colour: slot A takes the clicked colour, slot B keeps its family and changes it only if A and B would otherwise be identical or if B equals the background. <code>decorationCombo(clicked, currentB, background)</code>. Mint Strong + Yellow Soft, click on Purple → Purple Strong + Yellow Strong. Never both slots the same.</div>
        <div className="rule"><b>Released on title slides</b>Only 03, 04, 06, 07, 08, 11, 14, 16, 17 (<code>titleSlideDecorations</code>, CLAUDE.md §8). Rotation: 07, 08, 11, 17 freely rotatable, 03, 04, 06, 14, 16 in 45° steps only. All other elements are not permitted there; for other asset types there is no restriction.</div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
