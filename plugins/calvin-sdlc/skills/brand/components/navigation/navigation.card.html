<div id="root"></div>
<script type="text/babel">
const { Tabs, Breadcrumbs, Pagination, Stepper, Icon } = window.OMRDesignSystem_d9b3c2;
function Demo() {
  const [tab, setTab] = React.useState('reviews');
  const [page, setPage] = React.useState(3);
  return (
    <div>
      <span className="txt-label-s-bold-uppercase lbl">Tabs</span>

        { id:'reviews', label:'Reviews', badge:1284 },
        { id:'pricing', label:'Pricing' },
        { id:'features', label:'Features' },
        { id:'alt', label:'Alternatives' },
      ]} />
      <span className="txt-label-s-bold-uppercase lbl">Breadcrumbs</span>
      <Breadcrumbs items={[{label:'Home',href:'#'},{label:'CRM software',href:'#'},{label:'Flowdesk CRM'}]} onNavigate={()=>{}} />
      <span className="txt-label-s-bold-uppercase lbl">Breadcrumbs — shortOnMobile (parent link + back chevron)</span>
      <Breadcrumbs shortOnMobile items={[{label:'Home',href:'#'},{label:'CRM software',href:'#'},{label:'Flowdesk CRM'}]} onNavigate={()=>{}} />

      <Stepper current={1} steps={[{label:'Account'},{label:'Company details'},{label:'Confirm'}]} />
      <span className="txt-label-s-bold-uppercase lbl">Pagination</span>
      <Pagination page={page} pageCount={12} onChange={setPage} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
