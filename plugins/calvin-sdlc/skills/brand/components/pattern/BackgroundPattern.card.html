<!-- @dsCard group="Components" viewport="880x900" name="Background patterns" subtitle="Low contrast · no contour · always in the bleed, never placed like an image" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--background-color-surface); color: var(--text-color-main); font-family: var(--font-sans); }
  .lbl { display: block; margin: 26px 0 14px; color: var(--text-color-subtlest); }
  .lbl:first-child { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .tile { border-radius: var(--radius-2xl); overflow: hidden; position: relative; height: 180px; }
  .tile .name { position: absolute; left: 14px; bottom: 12px; font-family: var(--font-mono); font-size: 11px; z-index: 2; }
  .tile .pad { position: absolute; inset: 0; }
  .rules { display:grid; grid-template-columns: repeat(3,1fr); gap:12px; }
  .rule { padding:14px 16px; border-radius: var(--radius-xl); border:1px solid var(--border-color-subtle); background: var(--background-color-surface-elevation-1); font-size:13px; color: var(--text-color-subtle); }
  .rule b { color: var(--text-color-main); display:block; margin-bottom:5px; }
  .combo { display:grid; grid-template-columns: repeat(3,1fr); gap:14px; }
  .cbox { border-radius: var(--radius-xl); overflow:hidden; height:170px; position:relative; }
  .cbox .tag { position:absolute; left:12px; top:10px; font-size:11px; font-family:var(--font-mono); padding:3px 8px; border-radius:999px; z-index:3; }
  .ok { background: var(--background-color-success-subtle); color: var(--text-color-success); }
  .no { background: var(--background-color-error-subtle); color: var(--text-color-error); }
  .cap { padding:0; font-size:11px; color: var(--text-color-subtle); margin-top:6px; font-family:var(--font-mono); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { BackgroundPattern } = window.OMRDesignSystem_d9b3c2;

// background hex per OMR tone (for the tile fill); pattern colour comes from the component
const BG = { 'purple-strong':'#601ee3','purple-soft':'#ebe8ff','mint-medium':'#00adad','yellow-soft':'#fdf2c4','purple-medium':'#8259ff','mint-soft':'#cef9f5' };

function Tile({ pattern, variant, bg, label }) {
  return (
    <div className="tile" style={{ background: BG[bg] }}>
      <div className="pad"><BackgroundPattern pattern={pattern} variant={variant} background={bg} /></div>
      <span className="name" style={{ color: (bg==='purple-strong'||bg==='purple-medium'||bg==='mint-medium') ? 'rgba(255,255,255,.85)' : 'rgba(12,13,15,.6)' }}>{label}</span>
    </div>
  );
}

function Demo() {
  return (
    <div>
      <span className="txt-label-s-bold-uppercase lbl">Four groups — filled &amp; outline · shape one shade off the background · always in the bleed</span>
      <div className="grid">
        <Tile pattern="rising-squares" variant="filled"  bg="purple-strong" label="rising-squares · filled · purple strong" />
        <Tile pattern="rising-squares" variant="outline" bg="purple-soft"   label="rising-squares · outline · purple soft" />
        <Tile pattern="floating-bulbs" variant="filled"  bg="mint-medium"   label="floating-bulbs · filled · mint medium" />
        <Tile pattern="floating-bulbs" variant="outline" bg="yellow-soft"   label="floating-bulbs · outline · yellow soft" />
        <Tile pattern="bubbles"        variant="filled"  bg="purple-medium" label="bubbles · filled · purple medium" />
        <Tile pattern="party-mix"      variant="filled"  bg="mint-soft"     label="party-mix · filled · mint soft" />
      </div>

      <span className="txt-label-s-bold-uppercase lbl">Placement &amp; combination</span>
      <div className="combo">
        <div>
          <div className="cbox" style={{ background: BG['purple-strong'] }}>
            <span className="tag ok">✓ correct</span>
            <BackgroundPattern pattern="rising-squares" variant="filled" background="purple-strong" scale={1.7} />
          </div>
          <div className="cap">scaled up · runs off all four edges</div>
        </div>
        <div>
          <div className="cbox" style={{ background: BG['purple-strong'] }}>
            <span className="tag no">✕ never</span>
            <div style={{position:'absolute', inset:28}}><BackgroundPattern pattern="rising-squares" variant="filled" background="purple-strong" bleed={false} /></div>
          </div>
          <div className="cap">placed like an image · fully visible, framed</div>
        </div>
        <div>
          <div className="cbox" style={{ background: BG['purple-strong'] }}>
            <span className="tag no">✕ never</span>
            <BackgroundPattern pattern="rising-squares" variant="filled" background="purple-strong" scale={1.7} />
            <BackgroundPattern pattern="bubbles" variant="filled" color="#ada6fc" scale={1.2} />
          </div>
          <div className="cap">mixing two groups</div>
        </div>
      </div>

      <span className="txt-label-s-bold-uppercase lbl">The rules</span>
      <div className="rules">
        <div className="rule"><b>Low contrast</b>The pattern sits quietly behind the content. Text on top always stays fully readable.</div>
        <div className="rule"><b>No contour</b>No stroke, border or outline on the shapes. The outline group is built from filled rings, not strokes.</div>
        <div className="rule"><b>Always in the bleed</b>Never placed like an image. Scaled up until it runs off all four frame edges, at minimum two.</div>
        <div className="rule"><b>Colour = one shade off</b>The pattern shape is exactly one shade from the background (Purple Strong → Purple Medium; Soft → one step darker).</div>
        <div className="rule"><b>Never black / white</b>Background patterns are never used on black or white surfaces.</div>
        <div className="rule"><b>One group per design</b>Never mix groups. Filled + outline of the same group may combine; different groups never do.</div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
