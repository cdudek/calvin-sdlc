<!-- @dsCard group="Brand" viewport="700x180" name="Motion" subtitle="Short, functional transitions" -->
<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--background-color-surface);color:var(--text-color-main);font-family:var(--font-sans)}
  .meta{color:var(--text-color-subtlest);font-size:11px;font-family:var(--font-mono);margin-top:6px}
</style></head><body>
  <div style="display:flex;flex-direction:column;gap:10px;font-family:var(--font-mono);font-size:12px;color:var(--text-color-subtle)">
    <div>fast <b style="color:var(--text-color-main)">100ms</b> · normal <b style="color:var(--text-color-main)">150ms</b> · slow <b style="color:var(--text-color-main)">200ms</b> · slower <b style="color:var(--text-color-main)">300ms</b></div>
    <div>easing — standard <b style="color:var(--text-color-main)">ease-in-out</b> · decelerate <b style="color:var(--text-color-main)">ease-out</b> · accelerate <b style="color:var(--text-color-main)">ease-in</b></div>
  </div>
  <div id="demo" style="margin-top:18px;width:56px;height:56px;border-radius:12px;background:var(--background-color-primary-main);transition:transform 300ms ease-in-out"></div>
  <p style="font-size:11px;color:var(--text-color-subtlest);font-family:var(--font-sans)">Hover the square →</p>
  <script>const d=document.getElementById('demo');d.parentElement.addEventListener('mouseover',()=>d.style.transform='translateX(120px)');d.parentElement.addEventListener('mouseout',()=>d.style.transform='none');</script>
</body></html>
