<!-- @dsCard group="Brand" viewport="700x150" name="OMR mark" subtitle="The “omr” glyph — compact / favicon use" -->
<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--background-color-surface);color:var(--text-color-main);font-family:var(--font-sans)}
  .meta{color:var(--text-color-subtlest);font-size:11px;font-family:var(--font-mono);margin-top:6px}
</style></head><body>
  <div style="display:flex;align-items:center;gap:32px">
    <div style="display:flex;align-items:center;justify-content:center;width:72px;height:72px;background:var(--background-color-surface-elevation-2);border-radius:16px"><img src="../assets/omr-mark.svg" alt="omr" style="width:44px"></div>
    <div style="display:flex;align-items:center;justify-content:center;width:72px;height:72px;background:var(--background-color-primary-main);border-radius:16px"><img src="../assets/omr-mark-white.svg" alt="omr" style="width:44px"></div>
    <div style="display:flex;align-items:center;justify-content:center;width:72px;height:72px;background:var(--background-color-surface-inverse);border-radius:16px"><img src="../assets/omr-mark-white.svg" alt="omr" style="width:44px"></div>
  </div>
  <p class="meta">Use the mark where the full wordmark won’t fit (avatars, favicons, app icons).</p>
</body></html>
