<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--background-color-surface);font-family:var(--font-sans)}
  .sw{display:flex;flex-wrap:wrap;gap:12px}
  .chip{display:flex;flex-direction:column;gap:6px}
  .box{width:104px;height:56px;border-radius:12px;border:1px solid var(--border-color-subtle)}
  .nm{font-size:12px;font-weight:600;color:var(--text-color-main)}
  .hx{font-size:11px;color:var(--text-color-subtlest);font-variant-numeric:tabular-nums}
  .stack{display:flex;flex-direction:column;gap:14px}
  .line{display:flex;align-items:center;gap:14px}
  .swm{width:40px;height:40px;border-radius:8px;flex:none;border:1px solid var(--border-color-subtle)}
</style></head><body><div class="sw"><div class="chip"><div class="box" style="background:#fdfdfd"></div><span class="nm">Grey 25</span><span class="hx">#fdfdfd</span></div><div class="chip"><div class="box" style="background:#f3f4f6"></div><span class="nm">Grey 100</span><span class="hx">#f3f4f6</span></div><div class="chip"><div class="box" style="background:#dfe1e5"></div><span class="nm">Grey 200</span><span class="hx">#dfe1e5</span></div><div class="chip"><div class="box" style="background:#9197a3"></div><span class="nm">Grey 400</span><span class="hx">#9197a3</span></div><div class="chip"><div class="box" style="background:#6c7380"></div><span class="nm">Grey 500</span><span class="hx">#6c7380</span></div><div class="chip"><div class="box" style="background:#353a42"></div><span class="nm">Grey 700</span><span class="hx">#353a42</span></div><div class="chip"><div class="box" style="background:#0c0d0f"></div><span class="nm">Grey 950</span><span class="hx">#0c0d0f</span></div></div>
</body></html>
