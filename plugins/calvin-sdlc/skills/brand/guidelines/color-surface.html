<!-- @dsCard group="Colors · 2 Web & Produkt (UI)" viewport="700x150" name="Surface & elevation" subtitle="Depth via surface tier — not shadows" -->
<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--background-color-surface);font-family:var(--font-sans)}
  .sw{display:flex;flex-wrap:wrap;gap:12px}
  .chip{display:flex;flex-direction:column;gap:6px}
  .box{width:104px;height:56px;border-radius:12px;border:1px solid var(--border-color-subtle)}
  .nm{font-size:12px;font-weight:600;color:var(--text-color-main)}
  .hx{font-size:11px;color:var(--text-color-subtlest);font-variant-numeric:tabular-nums}
  .stack{display:flex;flex-direction:column;gap:14px}
  .line{display:flex;align-items:center;gap:14px}
  .swm{width:40px;height:40px;border-radius:8px;flex:none;border:1px solid var(--border-color-subtle)}
</style></head><body><div class="sw"><div class="chip"><div class="box" style="background:var(--background-color-surface)"></div><span class="nm">surface</span><span class="hx">#fdfdfd</span></div><div class="chip"><div class="box" style="background:var(--background-color-surface-elevation-1)"></div><span class="nm">elevation-1</span><span class="hx">#f8f9fb</span></div><div class="chip"><div class="box" style="background:var(--background-color-surface-elevation-2)"></div><span class="nm">elevation-2</span><span class="hx">#f3f4f6</span></div><div class="chip"><div class="box" style="background:var(--background-color-surface-elevation-3)"></div><span class="nm">elevation-3</span><span class="hx">#ebecef</span></div><div class="chip"><div class="box" style="background:var(--background-color-surface-elevation-4)"></div><span class="nm">elevation-4</span><span class="hx">#dfe1e5</span></div><div class="chip"><div class="box" style="background:var(--background-color-surface-elevation-5)"></div><span class="nm">elevation-5</span><span class="hx">#d0d3d9</span></div><div class="chip"><div class="box" style="background:var(--background-color-surface-inverse)"></div><span class="nm">inverse</span><span class="hx">#060708</span></div></div>
</body></html>
