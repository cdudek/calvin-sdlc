<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--background-color-surface);color:var(--text-color-main);font-family:var(--font-sans)}
  .row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .bar{background:var(--background-color-primary-subtle);height:16px;border-radius:var(--radius-xs)}
  .tok{font-family:var(--font-mono);font-size:11px;color:var(--text-color-subtlest);width:64px}
  .val{font-size:11px;color:var(--text-color-subtlest);margin-left:auto}
</style></head><body><div class="row"><span class="tok">p-1</span><div class="bar" style="width:4px"></div><span class="val">4px</span></div><div class="row"><span class="tok">p-2</span><div class="bar" style="width:8px"></div><span class="val">8px</span></div><div class="row"><span class="tok">p-3</span><div class="bar" style="width:12px"></div><span class="val">12px</span></div><div class="row"><span class="tok">p-4</span><div class="bar" style="width:16px"></div><span class="val">16px</span></div><div class="row"><span class="tok">p-6</span><div class="bar" style="width:24px"></div><span class="val">24px</span></div><div class="row"><span class="tok">p-8</span><div class="bar" style="width:32px"></div><span class="val">32px</span></div><div class="row"><span class="tok">p-12</span><div class="bar" style="width:48px"></div><span class="val">48px</span></div><div class="row"><span class="tok">p-16</span><div class="bar" style="width:64px"></div><span class="val">64px</span></div>
</body></html>
