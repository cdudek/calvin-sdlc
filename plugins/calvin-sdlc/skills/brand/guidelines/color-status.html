<!-- @dsCard group="Colors · 2 Web & Produkt (UI)" viewport="700x220" name="Status colours" subtitle="Success · error · warning — fill + border + text" -->
<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--background-color-surface);font-family:var(--font-sans)}
  .sw{display:flex;flex-wrap:wrap;gap:12px}
  .chip{display:flex;flex-direction:column;gap:6px}
  .box{width:104px;height:56px;border-radius:12px;border:1px solid var(--border-color-subtle)}
  .nm{font-size:12px;font-weight:600;color:var(--text-color-main)}
  .hx{font-size:11px;color:var(--text-color-subtlest);font-variant-numeric:tabular-nums}
  .stack{display:flex;flex-direction:column;gap:14px}
  .line{display:flex;align-items:center;gap:14px}
  .swm{width:40px;height:40px;border-radius:8px;flex:none;border:1px solid var(--border-color-subtle)}
</style></head><body><div class="stack"><div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--background-color-success-subtle);border:1px solid var(--border-color-success-subtle)">
      <span class="text-success" style="font-weight:700;font-size:15px">Success</span>
      <span class="hx" style="margin-left:auto">bg-success-subtle · border-success · text-success</span>
    </div><div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--background-color-error-subtle);border:1px solid var(--border-color-error)">
      <span class="text-error" style="font-weight:700;font-size:15px">Error</span>
      <span class="hx" style="margin-left:auto">bg-error-subtle · border-error · text-error</span>
    </div><div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--background-color-warning-subtle);border:1px solid var(--border-color-warning)">
      <span class="text-warning" style="font-weight:700;font-size:15px">Warning</span>
      <span class="hx" style="margin-left:auto">bg-warning-subtle · border-warning · text-warning</span>
    </div></div>
</body></html>
