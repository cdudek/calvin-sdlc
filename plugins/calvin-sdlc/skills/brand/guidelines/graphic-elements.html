<head>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 28px; background: var(--background-color-surface); color: var(--text-color-main); font-family: var(--font-sans); }
  h2 { margin: 0 0 4px; }
  .sub { margin: 0 0 24px; color: var(--text-color-subtle); max-width: 70ch; }
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .col { border: 1px solid var(--border-color-subtle); border-radius: var(--radius-2xl); overflow: hidden; display: flex; flex-direction: column; }
  .art { height: 168px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .body { padding: 16px 18px 20px; }
  .body h3 { margin: 0 0 8px; }

</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { Decoration, GraphicElement, BackgroundPattern } = window.OMRDesignSystem_d9b3c2;

function Demo() {
  return (
    <div>
      <h2 className="txt-headline-l-bold">Graphic design elements</h2>
      <p className="sub txt-body-m-regular">Three categories of supporting graphics that give a visual its OMR character. Each has its own job — and its own binding rules.</p>
      <div className="cols">

        <div className="col">
          <div className="art" style={{ background: 'var(--background-color-surface-elevation-1)' }}>
            <Decoration name="03" direction="left" size={80} style={{ position:'absolute', top:14, left:14 }} />
            <Decoration name="03" direction="right" size={80} style={{ position:'absolute', bottom:14, right:14 }} />
            <span className="demoTitle">OMR visual</span>
          </div>
          <div className="body">
            <h3 className="txt-headline-m-bold">Decoration</h3>
            <ul>
              <li>The <b>default</b> way to design an OMR title or chapter slide.</li>
              <li><b>One kind per slide</b>, used <b>up to 3 times</b> — never two different elements.</li>
              <li>Colours from the <b>Brand Kit Colors</b> palette, in combinations that work together.</li>
              <li>Never in the foreground; <b>never over key motifs or text</b>.</li>
            </ul>
          </div>
        </div>

        <div className="col">
          <div className="art" style={{ background: 'var(--background-color-surface-elevation-1)', color: 'var(--text-color-primary)' }}>
            <GraphicElement name="super-nova" variant="filled" size={220} style={{ position:'absolute', left:-64 }} />
            <div style={{ position:'absolute', right:16, color:'var(--text-color-primary)' }}>
              <div style={{ position:'relative' }}>
                <GraphicElement name="super-nova" variant="filled" size={76} />
                <span style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', color:'#fff', fontWeight:800, fontSize:24, transform:'translateY(-0.05em)' }}>1</span>
              </div>
            </div>
          </div>
          <div className="body">
            <h3 className="txt-headline-m-bold">Graphic element</h3>
            <ul>
              <li>Sets <b>focus</b> / acts as an eye-catcher (Störer).</li>
              <li><b>Content carrier</b> (numbered super-nova), pattern block (plus/x).</li>
              <li>Overlay on an image, or <b>zoomed huge</b> to split the layout.</li>
              <li>Text <b>sits centred inside</b> the shape with padding to the edge — very short content only. If it won't fit, resize, shorten, or set it beside the shape instead. Never let text overflow the Störer.</li>
            </ul>
          </div>
        </div>

        <div className="col">
          <div className="art" style={{ background: '#601ee3' }}>
            <BackgroundPattern pattern="bubbles" variant="filled" background="purple-strong" scale={1.7} />
            <span className="demoTitle" style={{ color:'#fff', position:'relative' }}>Foreground</span>
          </div>
          <div className="body">
            <h3 className="txt-headline-m-bold">Background pattern</h3>
            <ul>
              <li>Subtle in the <b>background</b>; never distracts.</li>
              <li>Shape <b>one shade off</b> the background colour.</li>
              <li>Always in the <b>bleed</b> — scaled up, never placed like an image.</li>
              <li><b>Never on black/white</b>; one group only; <b>never together with decorations</b>.</li>
            </ul>
          </div>
        </div>

      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
