<!-- @dsCard group="Colors · 2 Web & Produkt (UI)" viewport="700x150" name="Brand palette" subtitle="Purple (primary) · Yellow (secondary) · Mint (tertiary)" -->
<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--background-color-surface);font-family:var(--font-sans)}
  .sw{display:flex;flex-wrap:wrap;gap:12px}
  .chip{display:flex;flex-direction:column;gap:6px}
  .box{width:104px;height:56px;border-radius:12px;border:1px solid var(--border-color-subtle)}
  .nm{font-size:12px;font-weight:600;color:var(--text-color-main)}
  .hx{font-size:11px;color:var(--text-color-subtlest);font-variant-numeric:tabular-nums}
  .stack{display:flex;flex-direction:column;gap:14px}
  .line{display:flex;align-items:center;gap:14px}
  .swm{width:40px;height:40px;border-radius:8px;flex:none;border:1px solid var(--border-color-subtle)}
</style></head><body><div class="sw"><div class="chip"><div class="box" style="background:#8259ff"></div><span class="nm">Purple 500</span><span class="hx">#8259ff</span></div><div class="chip"><div class="box" style="background:#7337fc"></div><span class="nm">Purple 600</span><span class="hx">#7337fc</span></div><div class="chip"><div class="box" style="background:#601ee3"></div><span class="nm">Purple 700</span><span class="hx">#601ee3</span></div><div class="chip"><div class="box" style="background:#4f18bf"></div><span class="nm">Purple 800</span><span class="hx">#4f18bf</span></div><div class="chip"><div class="box" style="background:#f2b200"></div><span class="nm">Yellow 500</span><span class="hx">#f2b200</span></div><div class="chip"><div class="box" style="background:#f5c41c"></div><span class="nm">Yellow 400</span><span class="hx">#f5c41c</span></div><div class="chip"><div class="box" style="background:#00adad"></div><span class="nm">Mint 500</span><span class="hx">#00adad</span></div></div>
</body></html>
