name: Release (signed + notarized)

# Signing credentials only exist on tag pushes from this repository. Pull
# requests - especially from forks - never get them, which is why this
# workflow has no pull_request trigger at all.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # only to attach the built artifact to the release

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        run: ./build_app.sh        # <- replace with your build command

      - name: Import signing certificate into an ephemeral keychain
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail          # never set -x here: it would echo secrets
          umask 077

          # A throwaway keychain, with a password generated in this run and
          # never stored anywhere. The certificate must not touch the default
          # login keychain, and must not outlive the job.
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 32)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYCHAIN_PW"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          CERT="$RUNNER_TEMP/cert.p12"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -P "$CERT"

          # Without this, codesign blocks on a UI prompt that no runner can answer.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null

          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

      - name: Store notarization credentials
        env:
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$AC_API_KEY_P8_BASE64" | base64 --decode > "$KEY"
          xcrun notarytool store-credentials "macsign" \
            --key "$KEY" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" \
            --keychain "$KEYCHAIN"
          rm -P "$KEY"

      - name: Sign, notarize and staple
        run: |
          set -euo pipefail
          curl -fsSL -o macsign \
            https://raw.githubusercontent.com/OWNER/REPO/main/scripts/macsign  # or commit it
          chmod +x macsign
          ./macsign release "dist/Your App.app"

      - name: Verify the artifact Apple actually blessed
        run: ./macsign verify "dist/Your App.app"

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.dmg'

      # Runs even when an earlier step fails, so a failed build never leaves a
      # certificate sitting in a keychain on a shared runner image.
      - name: Destroy the ephemeral keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -Pf "$RUNNER_TEMP"/*.p12 "$RUNNER_TEMP"/*.p8 2>/dev/null || true
