# `@claude` in a PR comment, review comment, review or issue: Claude addresses it and
# pushes a commit to the PR branch. The review comment loop from the playbook -- the
# instance that FIXES is not the instance that REVIEWED. Its commits are still gated by
# CI and merge-gate like anyone's. docs/sdlc.md, "Claude in CI".
#
# Straight from anthropics/claude-code-action/examples/claude.yml, pinned. Ships dark
# without ANTHROPIC_API_KEY.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # read CI results on PRs
    steps:
      - name: Is the key seeded?
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not set; @claude ignored (docs/sdlc.md, Secrets)"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 1

{{SETUP_STEP}}
      - name: Run Claude Code
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1.0.216
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --max-budget-usd 3
            --allowedTools "{{CLAUDE_ALLOW}}"
