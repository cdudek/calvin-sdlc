# Claude reviews a PR ONCE against REVIEW.md -- when it opens, leaves draft, or gets the
# `re-review` label -- and `merge-gate` turns the tally into a check on every push: red on
# any Important, red when the reviewed SHA is not the head. Humans review intent and risk
# (the plan), not every line. docs/sdlc.md, "Claude in CI".
#
# Cost is the design constraint: Sonnet, one pass, a turn cap and a USD cap, and no run on
# `synchronize`. A push after a clean review does not re-review by itself -- the author
# adds the `re-review` label when the head is worth the ~$1. Three days of Opus on every
# push cost $331 (2026-09-05..07); the target is under $2 per PR.
#
# Ships dark: without ANTHROPIC_API_KEY both jobs are green with a notice, so
# `merge-gate` can already be a required check. Bot PRs (image bumps, dependabot) skip
# the review entirely -- the action refuses bot-authored commits (claude-code-action
# #1299) and a skipped review must never be a red required check.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    name: claude review
    # ONLY on the PR into the default branch. Feature PRs into `milestone/*` and
    # milestone PRs into `project/*` are interior merges within one change: the code
    # they carry is reviewed once, at the integration PR, not three times on its way
    # there. Reviewing every interior PR costs ~$1 a pop and re-reads the same diff.
    if: >-
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.user.type != 'Bot' && github.event.pull_request.draft == false &&
      (github.event.action == 'opened' || github.event.action == 'reopened' ||
       github.event.action == 'ready_for_review' ||
       (github.event.action == 'labeled' && github.event.label.name == 're-review'))
    runs-on: ubuntu-24.04
    outputs:
      ran: ${{ steps.key.outputs.present }}
    steps:
      - name: Is the key seeded?
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not set; Claude review skipped (docs/sdlc.md, Secrets)"
          fi

      - name: Consume the re-review label
        if: github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --remove-label re-review

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review against REVIEW.md
        id: claude
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1.0.216
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Read REVIEW.md at the repo root first and follow it exactly: ONE pass over the
            diff (`gh pr diff`), Important vs Nit as defined there, at most five nits,
            nothing CI already enforces. Open a file only when the diff alone cannot settle
            a finding; never walk the repo. If the PR body names a changes/<KEY>-<slug>/
            folder (or its archive/ path), read its facts.md and plan.md for compliance.

            Post every Important finding and every kept nit as an inline comment on the
            exact line. Then post one top-level comment whose last line is exactly:
            IMPORTANT: <n>  NITS: <m>  SHA: <the HEAD SHA above>
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 30
            --max-budget-usd 2
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  merge-gate:
    name: merge-gate
    needs: review
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - name: Gate on the latest tally for this head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BOT: ${{ github.event.pull_request.user.type }}
          DRAFT: ${{ github.event.pull_request.draft }}
          RESULT: ${{ needs.review.result }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Interior PR (feature -> milestone/*, milestone -> project/*). The review runs
          # once, on the PR into the default branch; this check still reports so it can be
          # a required check there without blocking the branches below it.
          if [ "$BASE" != "$DEFAULT_BRANCH" ]; then echo "::notice::PR targets $BASE, not $DEFAULT_BRANCH; reviewed at the integration PR"; exit 0; fi
          if [ "$BOT" = "Bot" ] || [ "$DRAFT" = "true" ]; then echo "::notice::bot or draft PR; merge-gate passes without a review"; exit 0; fi
          if [ -z "$KEY" ]; then echo "::notice::no ANTHROPIC_API_KEY; merge-gate passes"; exit 0; fi
          case "$RESULT" in
            failure|cancelled) echo "::error::claude review job ${RESULT}; fix it or add the re-review label"; exit 1 ;;
          esac
          # The tally line the review posts: `IMPORTANT: n  NITS: m  SHA: <head>`. Read the
          # newest one from the PR's comments so a push without a review still gets a verdict
          # (on the old SHA -- which fails below until the author asks for a re-review).
          tally=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.type == "Bot") | . as $c | ($c.body | scan("IMPORTANT: [0-9]+  NITS: [0-9]+  SHA: [0-9a-f]+")) | "\($c.updated_at) \(.)"' \
            | sort | tail -1 | cut -d' ' -f2-)
          if [ -z "$tally" ]; then
            # The action skips itself when THIS file differs from master (anti-tamper: a PR
            # cannot rewrite its own reviewer). That is the one legitimate missing tally, and
            # it is checked against the PR's file list, not assumed. Claude cannot review such
            # a PR, so it fails closed: only a human approval lets it through.
            if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path' | grep -qx '.github/workflows/claude-review.yml'; then
              decision=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json reviewDecision --jq .reviewDecision)
              if [ "$decision" = "APPROVED" ]; then
                echo "::notice::this PR changes claude-review.yml and a human approved it"; exit 0
              fi
              echo "::error::this PR changes claude-review.yml, so Claude cannot review it; a human must approve it"; exit 1
            fi
            echo "::error::no Claude review tally on this PR yet -- add the re-review label"; exit 1
          fi
          echo "$tally"
          important=$(printf '%s' "$tally" | sed -E 's/^IMPORTANT: ([0-9]+).*/\1/')
          sha=$(printf '%s' "$tally" | sed -E 's/.*SHA: ([0-9a-f]+)$/\1/')
          if [ "$sha" != "$HEAD" ]; then
            echo "::error::the last review is for $sha, the head is $HEAD -- add the re-review label when this head is ready"; exit 1
          fi
          if [ "$important" -gt 0 ]; then
            echo "::error::$important Important finding(s) from Claude review -- address them, then add the re-review label"; exit 1
          fi
