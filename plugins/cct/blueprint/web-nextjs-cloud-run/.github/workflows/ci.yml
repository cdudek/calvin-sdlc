name: CI

# Every PR and every push to main. `check` is the one required status: it passes only when
# every job before it passed (a skipped Docker job counts as passed until the app exists).
# Security: no github.event.* expression is expanded inside a `run:` script.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans the git history, so a shallow clone would scan almost nothing
          fetch-depth: 0
      # Its own job, before any repository code runs. The binary lives outside the checkout,
      # pinned by version and sha256 (the gitleaks action needs a paid licence for organisations),
      # and a PR cannot quietly switch rules off with its own config or ignore file.
      - name: gitleaks
        run: |
          test ! -e .gitleaks.toml -a ! -e gitleaks.toml -a ! -e .gitleaksignore \
            || { echo '::error::gitleaks config or ignore file in the repo; rules change only in this workflow'; exit 1; }
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose --exit-code 1 --config .github/gitleaks.toml

  checks:
    name: Format, lint, typecheck, test, e2e
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:background

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Known vulnerabilities in the lockfile (HIGH and CRITICAL with a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  docker:
    name: Dockerfile lint, build and image scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - name: Misconfigurations in the Dockerfile
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
      # The images need the Next.js app (milestone 1); until it exists, lint and config only.
      - id: app
        run: |
          if ls next.config.* >/dev/null 2>&1 && [ -f scripts/migrate.ts ]; then echo "ready=true"; else echo "ready=false"; fi >>"$GITHUB_OUTPUT"
      - if: steps.app.outputs.ready == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.app.outputs.ready == 'true'
        name: Build web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          build-args: GIT_SHA=${{ github.sha }}
          tags: heydiff-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - if: steps.app.outputs.ready == 'true'
        name: Build migrate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrate
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          tags: heydiff-migrate:ci
          load: true
          cache-from: type=gha,scope=web
      - if: steps.app.outputs.ready == 'true'
        name: Scan web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: heydiff-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - if: steps.app.outputs.ready == 'true'
        name: Scan migrate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: heydiff-migrate:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - if: steps.app.outputs.ready == 'true'
        name: The image runs as non-root, has no shell, and serves /readyz with the sha
        env:
          SHA: ${{ github.sha }}
          SMOKE_DATABASE_URL: postgres://postgres:postgres@host.docker.internal:5432/postgres
        run: bash scripts/docker-smoke.sh heydiff-web:ci "$SHA"

  check:
    name: check
    if: always()
    needs: [secrets-scan, checks, dependencies, docker]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a required job ended $r"; exit 1; }; done
